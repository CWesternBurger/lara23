services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        image: lara23-app:latest
        ports:
            - '${APP_PORT:-8080}:80'
        env_file:
            - .env
        environment:
            APP_ENV: '${APP_ENV:-local}'
            APP_DEBUG: '${APP_DEBUG:-true}'
            APP_URL: '${APP_URL:-http://localhost:${APP_PORT:-8080}}'
            RUN_MIGRATIONS: '${RUN_MIGRATIONS:-false}'
        volumes:
            - .:/var/www/html
            - vendor-data:/var/www/html/vendor
        depends_on:
            mysql:
                condition: service_healthy
        restart: unless-stopped

    mysql:
        image: mysql:8.4
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD:-password}'
            MYSQL_DATABASE: '${DB_DATABASE:-laravel}'
            MYSQL_USER: '${DB_USERNAME:-laravel}'
            MYSQL_PASSWORD: '${DB_PASSWORD:-password}'
        volumes:
            - mysql-data:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-p${DB_PASSWORD:-password}']
            interval: 10s
            timeout: 5s
            retries: 5
        restart: unless-stopped

    phpmyadmin:
        image: phpmyadmin:latest
        depends_on:
            mysql:
                condition: service_healthy
        ports:
            - '${PHPMYADMIN_PORT:-8081}:80'
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306
            PMA_USER: '${DB_USERNAME:-laravel}'
            PMA_PASSWORD: '${DB_PASSWORD:-password}'
        restart: unless-stopped

volumes:
    mysql-data:
    vendor-data:
